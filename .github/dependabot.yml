# Dependabot：每日检查 NuGet；三组 PR（互不混入）。
# ppy-osu / ez2lazer-game / other-nuget；CI 通过后自动合并。
version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    target-branch: "master"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    groups:
      ppy-osu:
        patterns:
          - "ppy.osu.Game"
          - "ppy.osu.Game.Rulesets.Osu"
      ez2lazer-game:
        patterns:
          - "ez2lazer.Game"
      other-nuget:
        patterns:
          - "*"
        exclude-patterns:
          - "ppy.osu.Game"
          - "ppy.osu.Game.Rulesets.Osu"
          - "ez2lazer.Game"
