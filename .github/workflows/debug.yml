#
# This workflow triggers at every commit push that changes code.
#

name: dotnet-debug

on:
  push:
    paths:
      - '**/*.cs'
      - '**/*.csproj'

jobs:
  dotnet-test:
    name: Check if the project can still build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build with dependencies for verification
        id: build
        run: dotnet build -p:RulesetVerifyBuild=true

      - name: Verify ruleset assembly loads
        run: pwsh .github/scripts/Verify-RulesetAssembly.ps1 -AssemblyPath osu.Game.Rulesets.Diva/bin/Debug/net8.0/osu.Game.Rulesets.Diva.dll

      - name: Publish single-DLL ruleset artifact
        run: dotnet publish osu.Game.Rulesets.Diva/osu.Game.Rulesets.Diva.csproj -c Debug --no-build

      - name: Give unit tests a spin
        run: dotnet test --no-build

      - name: Upload artifact for further testing
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: osu.Game.Rulesets.Diva/bin/Debug/net8.0/publish/osu.Game.Rulesets.Diva.dll
