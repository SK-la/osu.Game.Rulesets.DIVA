# 发布 tag 格式：yyyy.mdd.0（与 osu! lazer 一致，例如 2026.524.0）
# 同一 Release 同时上传 net8（官方 lazer）与 net10（Ez2Lazer）DLL。
name: Release DIVA ruleset

on:
  push:
    tags:
      - '20*'
  workflow_dispatch:
    inputs:
      tag:
        description: '发布版本（如 2026.524.0）'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish ruleset DLL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          $tag = '${{ github.event.inputs.tag }}'
          if ([string]::IsNullOrWhiteSpace($tag)) {
            $tag = '${{ github.ref_name }}'
          }
          if ($tag -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$') {
            Write-Error "Tag must be yyyy.mdd.0 (e.g. 2026.524.0), got: $tag"
            exit 1
          }
          Write-Host "ReleaseVersion=$tag"
          "value=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Verify ruleset assembly loads
        run: >
          dotnet build osu.Game.Rulesets.Diva/osu.Game.Rulesets.Diva.csproj
          -c Release
          -p:RulesetVerifyBuild=true
          &&
          pwsh .github/scripts/Verify-RulesetAssembly.ps1
          -AssemblyPath osu.Game.Rulesets.Diva/bin/Release/net10.0/osu.Game.Rulesets.Diva.dll

      - name: Publish ruleset
        shell: pwsh
        run: |
          $ver = '${{ steps.version.outputs.value }}'
          foreach ($tfm in @('net10.0')) {
            dotnet publish osu.Game.Rulesets.Diva/osu.Game.Rulesets.Diva.csproj `
              -c Release `
              -f $tfm `
              -p:OfficialRelease=true `
              -p:ReleaseVersion=$ver
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Copy-Item osu.Game.Rulesets.Diva/bin/Release/net10.0/publish/osu.Game.Rulesets.Diva.dll `
            artifacts/osu.Game.Rulesets.Diva.net10.0.dll -Force

      - name: Upload release asset (tag push)
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ steps.version.outputs.value }}
          files: |
            artifacts/osu.Game.Rulesets.Diva.net10.0.dll
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release asset (manual)
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.value }}
          name: Release ${{ steps.version.outputs.value }}
          generate_release_notes: true
          files: |
            artifacts/osu.Game.Rulesets.Diva.net10.0.dll
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
